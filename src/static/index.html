<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-top-row">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="admin-controls">
          <button id="admin-toggle" class="admin-icon-btn" aria-label="Admin menu">👤</button>
          <div id="admin-panel" class="admin-panel hidden">
            <p id="admin-status">Viewing as student</p>
            <button id="show-login" type="button">Teacher Login</button>
            <button id="logout-btn" type="button" class="hidden">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Registration Policy</h3>
        <p>
          Students can view activities and participants.
          Teacher login is required to register or unregister students.
        </p>
        <form id="admin-login-form" class="hidden">
          <div class="form-group">
            <label for="teacher-username">Teacher Username:</label>
            <input type="text" id="teacher-username" required />
          </div>
          <div class="form-group">
            <label for="teacher-password">Teacher Password:</label>
            <input type="password" id="teacher-password" required />
          </div>
          <button type="submit">Login</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
